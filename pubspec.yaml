name: dual_custom_date_picker
description: "A flutter package for custom Jalali and Georgian date picker"
version: 1.3.1
homepage: https://github.com/Arefyazdkhasti/custom_date_picker

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  persian_number_utility: ^1.1.6
  shamsi_date: ^1.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - screenshots/
