name: dual_custom_date_picker
description: "A flutter package for custom Jalali and Georgian date picker"
version: 2.0.0
homepage: https://github.com/Arefyazdkhasti/custom_date_picker

environment:
  # material_ui / cupertino_ui require Dart >=3.13 / Flutter >=3.47.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  persian_number_utility: ^1.1.6
  shamsi_date: ^1.1.1
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - screenshots/
